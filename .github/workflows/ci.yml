name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test must fail in minutes, not burn the runner for hours (a real incident on the
    # Windows runner). Generous over the ~5 min norm, but a hard ceiling.
    timeout-minutes: 20
    # Postgres for the multi-node backend tests. They skip when
    # KALITKA_TEST_POSTGRES is unset (local runs); here it is set, so they run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalitka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - run: dotnet build src/Kalitka/Kalitka.csproj -c Release

      - run: dotnet test tests/Kalitka.Tests/Kalitka.Tests.csproj -c Release
        env:
          KALITKA_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=kalitka"

      # MCP gateway (net9, no external deps): its canonicalization conformance vectors are a
      # security boundary, so they run in CI. (The net10/Windows agents build separately.)
      - run: dotnet test tests/KalitkaMcpGateway.Tests/KalitkaMcpGateway.Tests.csproj -c Release

  agent-windows:
    # The net10.0-windows agent reaches Windows security APIs (WTS session teardown, token
    # impersonation, CNG), so its tests need a real Windows runner — they cannot run in the
    # Ubuntu job above. This gates RDP-JIT enforcement to the same standard as Core.
    runs-on: windows-latest
    # The Windows runner bills at a multiplier; a hung test here is the expensive kind. Cap it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test tests/KalitkaAgent.Windows.Tests/KalitkaAgent.Windows.Tests.csproj -c Release

  image:
    # Prove the Dockerfile still builds on every change. No push here; that only
    # happens on a tag, in release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
