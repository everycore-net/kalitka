name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - run: dotnet build src/Kalitka/Kalitka.csproj -c Release

      - run: dotnet test tests/Kalitka.Tests/Kalitka.Tests.csproj -c Release

  image:
    # Prove the Dockerfile still builds on every change. No push here; that only
    # happens on a tag, in release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
