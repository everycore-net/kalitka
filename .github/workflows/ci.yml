name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore src/Kalitka/Kalitka.csproj

      - run: dotnet build src/Kalitka/Kalitka.csproj -c Release --no-restore

      # A test suite is tracked separately. When test projects exist this picks
      # them up; until then it is a no-op rather than a failure.
      - name: Test
        run: |
          if ls tests/**/*.csproj >/dev/null 2>&1; then
            dotnet test -c Release
          else
            echo "No test projects yet — skipping."
          fi

  image:
    # Prove the Dockerfile still builds on every change. No push here; that only
    # happens on a tag, in release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
