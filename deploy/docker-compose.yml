# Kalitka runs in the request path of your reverse proxy and needs nothing else:
# no Docker socket, no host access, no database. State is a small volume.
#
#   cp .env.example .env   # fill in
#   docker compose up -d --build

services:

  kalitka:
    build:
      context: ..
    image: kalitka:latest
    restart: unless-stopped
    environment:
      Kalitka__BotToken: ${KALITKA_BOT_TOKEN}
      Kalitka__WebhookPath: ${KALITKA_WEBHOOK_PATH}
      Kalitka__WebhookSecret: ${KALITKA_WEBHOOK_SECRET}
      Kalitka__AdminIds__0: ${KALITKA_ADMIN_ID}

      Kalitka__HmacSecret: ${KALITKA_HMAC_SECRET}
      Kalitka__GateHost: ${KALITKA_HOST}
      Kalitka__CookieDomain: ${KALITKA_COOKIE_DOMAIN}
      # How long an approval lasts. Also changeable at runtime with /session.
      Kalitka__SessionMinutes: "720"
      # What a Google sign-in grants: Application (default, one host per sign-in)
      # or Domain (one sign-in opens every guarded host under the cookie domain).
      # Manual approvals are always per-host.
      # Kalitka__SessionScope: Application

      # Which proxies may speak for a client. Forwarded headers are honoured
      # ONLY for requests arriving from one of these, and the client address is
      # then read from X-Forwarded-For from the right, past them.
      # For Docker this is the bridge subnet:
      #   docker network inspect proxy -f '{{(index .IPAM.Config 0).Subnet}}'
      Kalitka__TrustedProxies__0: 172.18.0.0/16

      # The forwardAuth is fail-closed. These networks skip the gate entirely
      # and are your tested way back in when the gate itself is broken.
      # They are matched against the CLIENT address, so TrustedProxies has to be
      # right first — the app refuses to start if it is missing.
      Kalitka__BypassNetworks__0: 192.168.0.0/16
      Kalitka__BypassNetworks__1: 10.0.0.0/8

      # How often one address may ring, and how many may wait at once.
      Kalitka__MaxRequestsPerIp: "5"
      Kalitka__RateWindowMinutes: "10"
      Kalitka__MaxPending: "50"

      # Hosts guarded on first start. Afterwards the list lives in the volume
      # and is changed with /hosts and the internal endpoint.
      # Kalitka__EnforcedHosts__0: app.example.com

      Kalitka__ListsPath: /data/lists.json
      Kalitka__EnforcedPath: /data/enforced.json
      Kalitka__SettingsPath: /data/settings.json

      # Optional: Google sign-in as the second way in.
      # Authorised redirect URIs at Google: https://<KALITKA_HOST>/oauth2/callback
      # and, for the web control plane, https://<KALITKA_HOST>/admin/oauth2/callback
      Kalitka__GoogleClientId: ${KALITKA_GOOGLE_CLIENT_ID:-}
      Kalitka__GoogleClientSecret: ${KALITKA_GOOGLE_CLIENT_SECRET:-}
      # Kalitka__GoogleDomains__0: example.com
      # Kalitka__GoogleEmails__0: someone@gmail.com

      # Optional: web control plane at /admin. Who may OPERATE kalitka (distinct
      # from who may enter hosts). AdminEmails is exact-match and primary;
      # AdminDomains is a broader, explicit mode. Neither set = web login off.
      # Kalitka__AdminEmails__0: ${KALITKA_ADMIN_EMAIL:-}
      # Kalitka__AdminDomains__0: example.com

      # Optional: e-mail approval channel. When SmtpHost is set, a new request
      # also mails AdminEmails an approve/deny one-time link. Empty = channel off.
      # Kalitka__SmtpHost: ${KALITKA_SMTP_HOST:-}
      # Kalitka__SmtpPort: "587"
      # Kalitka__SmtpUser: ${KALITKA_SMTP_USER:-}
      # Kalitka__SmtpPassword: ${KALITKA_SMTP_PASSWORD:-}
      # Kalitka__SmtpFrom: ${KALITKA_SMTP_FROM:-}

      # Optional: let another service arm/disarm hosts over /internal/*.
      Kalitka__InternalSecret: ${KALITKA_INTERNAL_SECRET:-}
    volumes:
      - kalitka-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.kalitka.entrypoints=websecure
      - traefik.http.routers.kalitka.rule=Host(`${KALITKA_HOST}`)
      - traefik.http.services.kalitka.loadbalancer.server.port=8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kalitka-data:

networks:
  proxy:
    external: true
