# nginx: gate a site with kalitka via auth_request.
#
# nginx's auth_request acts on the *status code* of a subrequest — 2xx lets the
# request through, 401/403 refuses it, anything else is a 500. It cannot follow
# a redirect. So kalitka is asked at /authz, which answers with a status only
# (200 or 401) and never a 302; nginx turns the 401 into a redirect to the gate
# itself, via error_page. (Traefik, Caddy and Envoy ext_authz use /auth instead,
# where a 302 is returned to the client directly.)
#
# Set kalitka's Kalitka__TrustedProxies to this nginx server's address, or the
# client-IP logic means nothing — see "Things worth knowing" in the README.

server {
    listen 443 ssl;
    server_name app.example.com;   # the guarded host

    # ---- the auth subrequest ------------------------------------------------
    location = /kalitka-auth {
        internal;
        proxy_pass              http://kalitka:8080/authz;
        proxy_pass_request_body off;                 # only the headers matter
        proxy_set_header        Content-Length "";
        # kalitka decides on these; do not forward the client's own X-Forwarded-*.
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-For  $remote_addr;
    }

    # ---- the application ----------------------------------------------------
    location / {
        auth_request /kalitka-auth;
        error_page 401 = @kalitka_gate;    # not authorized → ring the gate
        proxy_pass http://app:8080;        # the real application (with its own login)
    }

    # ---- send the visitor to the gate to ring ------------------------------
    # $host is the guarded name; the gate signs a session for exactly it.
    location @kalitka_gate {
        return 302 https://gate.example.com/request?target=$host;
    }
}
